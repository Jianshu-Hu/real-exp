<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wuji Glove Monitor</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #f4f5f2; color: #202421; }
    header { height: 64px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #cfd4cf; background: #ffffff; }
    h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: 0; }
    .identity { color: #5b625d; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .metrics { display: flex; gap: 18px; align-items: center; font-size: 13px; }
    .metric strong { font-size: 15px; font-variant-numeric: tabular-nums; }
    .status { width: 9px; height: 9px; border-radius: 50%; background: #ac3f35; display: inline-block; margin-right: 7px; }
    .status.live { background: #237b4b; }
    main { height: calc(100vh - 64px); min-height: 520px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(360px, 1fr); }
    section { min-width: 0; min-height: 0; position: relative; background: #ffffff; }
    section + section { border-left: 1px solid #cfd4cf; }
    .section-title { position: absolute; z-index: 2; left: 20px; top: 16px; font-size: 13px; font-weight: 650; color: #454c47; }
    canvas { display: block; width: 100%; height: 100%; }
    .error { position: fixed; inset: 64px 0 0; display: none; place-items: center; background: rgba(244,245,242,.94); color: #8d3029; font-weight: 600; z-index: 5; padding: 24px; text-align: center; }
    @media (max-width: 800px) {
      header { height: auto; min-height: 72px; padding: 12px 16px; align-items: flex-start; gap: 12px; }
      .metrics { flex-wrap: wrap; justify-content: flex-end; gap: 8px 14px; }
      .identity { display: none; }
      main { height: auto; min-height: calc(100vh - 72px); grid-template-columns: 1fr; grid-template-rows: minmax(440px, 58vh) minmax(420px, 50vh); }
      section + section { border-left: 0; border-top: 1px solid #cfd4cf; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Wuji Glove Monitor</h1>
      <div class="identity" id="identity">Waiting for glove</div>
    </div>
    <div class="metrics">
      <span><i class="status" id="statusDot"></i><span id="statusText">Connecting</span></span>
      <span class="metric">Rate <strong id="rate">0.0</strong> Hz</span>
      <span class="metric">Min confidence <strong id="confidence">0.000</strong></span>
      <span class="metric">Frame <strong id="sequence">0</strong></span>
    </div>
  </header>
  <main>
    <section>
      <div class="section-title">21-landmark hand skeleton</div>
      <canvas id="skeleton"></canvas>
    </section>
    <section>
      <div class="section-title">Retargeted Wuji Hand 2 command (rad)</div>
      <canvas id="commands"></canvas>
    </section>
  </main>
  <div class="error" id="error"></div>
  <script>
    const skeletonCanvas = document.getElementById('skeleton');
    const commandCanvas = document.getElementById('commands');
    const fingers = [
      {name:'Thumb', ids:[0,1,2,3,4], color:'#c4493d'},
      {name:'Index', ids:[0,5,6,7,8], color:'#287f5b'},
      {name:'Middle', ids:[0,9,10,11,12], color:'#2875a8'},
      {name:'Ring', ids:[0,13,14,15,16], color:'#8a58a5'},
      {name:'Pinky', ids:[0,17,18,19,20], color:'#b26c22'}
    ];
    let latest = null;

    function fitCanvas(canvas) {
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width; canvas.height = height;
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return {ctx, width: rect.width, height: rect.height};
    }

    function projectPoints(keypoints, width, height) {
      const raw = keypoints.map(point => {
        const [x,y,z] = point;
        return [0.82*x - 0.57*y, -0.28*x - 0.40*y - 0.87*z];
      });
      const xs=raw.map(p=>p[0]), ys=raw.map(p=>p[1]);
      const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
      const spanX=Math.max(0.08,maxX-minX), spanY=Math.max(0.12,maxY-minY);
      const scale=Math.min((width-100)/spanX,(height-130)/spanY);
      const centerX=(minX+maxX)/2, centerY=(minY+maxY)/2;
      return raw.map(([x,y]) => [width/2+(x-centerX)*scale,height/2+(y-centerY)*scale]);
    }

    function drawSkeleton() {
      const {ctx, width, height} = fitCanvas(skeletonCanvas);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = '#e1e5e1'; ctx.lineWidth = 1;
      for (let i=1; i<5; i++) {
        ctx.beginPath(); ctx.moveTo(width*i/5, 0); ctx.lineTo(width*i/5, height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, height*i/5); ctx.lineTo(width, height*i/5); ctx.stroke();
      }
      if (!latest) return;
      const points = projectPoints(latest.keypoints, width, height);
      fingers.forEach(finger => {
        ctx.strokeStyle = finger.color; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        finger.ids.forEach((id, i) => i ? ctx.lineTo(...points[id]) : ctx.moveTo(...points[id]));
        ctx.stroke();
        finger.ids.slice(1).forEach(id => {
          const confidence = latest.confidence[id];
          ctx.beginPath(); ctx.arc(points[id][0], points[id][1], 4.5, 0, Math.PI*2);
          ctx.fillStyle = confidence < 0.25 ? '#ac3f35' : finger.color; ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
        });
      });
      const wrist = points[0]; ctx.beginPath(); ctx.arc(wrist[0], wrist[1], 6, 0, Math.PI*2); ctx.fillStyle='#202421'; ctx.fill();
    }

    function drawCommands() {
      const {ctx, width, height} = fitCanvas(commandCanvas);
      ctx.clearRect(0, 0, width, height); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,width,height);
      const left=54, right=18, top=60, bottom=54;
      const plotW=Math.max(1,width-left-right), plotH=Math.max(1,height-top-bottom), zero=top+plotH/2;
      ctx.font='12px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.fillStyle='#6b726d';
      [-1,0,1].forEach(v => {
        const y=zero-v*(plotH/3); ctx.strokeStyle=v===0?'#9da49f':'#e1e5e1'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(left,y); ctx.lineTo(width-right,y); ctx.stroke();
        ctx.fillText((v>0?'+':'')+v.toFixed(1),8,y+4);
      });
      if (!latest) return;
      const gap=4, groupGap=10, totalGap=15*gap+4*groupGap, barW=Math.max(5,(plotW-totalGap)/20);
      let x=left;
      latest.qpos.forEach((value,index) => {
        const group=Math.floor(index/4), h=Math.min(plotH/2,Math.abs(value)*(plotH/3));
        const y=value>=0?zero-h:zero;
        ctx.fillStyle=fingers[group].color; ctx.fillRect(x,y,barW,h);
        ctx.save(); ctx.translate(x+barW/2,height-28); ctx.rotate(-Math.PI/2); ctx.textAlign='right';
        ctx.fillStyle='#5b625d'; ctx.font='10px ui-monospace, SFMono-Regular, Menlo, monospace'; ctx.fillText(`${group+1}.${index%4+1}`,0,3); ctx.restore();
        x+=barW+(index%4===3&&index<19?groupGap:gap);
      });
    }

    async function poll() {
      try {
        const response = await fetch('/api/frame', {cache:'no-store'});
        const frame = await response.json();
        if (frame.error) throw new Error(frame.error);
        if (frame.ready) {
          latest=frame;
          document.getElementById('identity').textContent=`${frame.serial}  |  ${frame.address}  |  ${frame.side}`;
          document.getElementById('rate').textContent=frame.hz.toFixed(1);
          document.getElementById('confidence').textContent=Math.min(...frame.confidence).toFixed(3);
          document.getElementById('sequence').textContent=frame.sequence;
          document.getElementById('statusText').textContent='Live'; document.getElementById('statusDot').classList.add('live');
          document.getElementById('error').style.display='none'; drawSkeleton(); drawCommands();
        }
      } catch (error) {
        const box=document.getElementById('error'); box.textContent=error.message; box.style.display='grid';
        document.getElementById('statusText').textContent='Error'; document.getElementById('statusDot').classList.remove('live');
      } finally { setTimeout(poll, 50); }
    }
    window.addEventListener('resize', () => { drawSkeleton(); drawCommands(); });
    drawSkeleton(); drawCommands(); poll();
  </script>
</body>
</html>
